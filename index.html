<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio | Simón Urrutia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- El botón de cambio de modo -->
    <button id="theme-toggle" class="theme-btn">🌙 Modo Oscuro</button>

    <header class="hero">
        <h1>Simón Urrutia</h1>
        <a href="https://github.com" target="_blank" class="github-link">Mi GitHub</a>
    </header>

    <main class="projects-container">
        <div class="card">
            <h2>Proyecto 1</h2>
        </div>
        <div class="card">
            <h2>Proyecto 2</h2>
        </div>
        <div class="card">
            <h2>Proyecto 3</h2>
        </div>
    </main>

        <!-- Sección de Tecnologías con Logos (Enlaces Corregidos y Estables) -->
    <footer class="tech-section">
        <div class="logos-container">
            <!-- Logo de HTML5 -->
            <img src="https://githubusercontent.com" alt="HTML5">
            <!-- Logo de CSS3 -->
            <img src="https://githubusercontent.com" alt="CSS3">
            <!-- Logo de JavaScript -->
            <img src="https://githubusercontent.com" alt="JavaScript">
        </div>
    </footer>


    <!-- Conectamos con el archivo de la lógica del botón -->
    <script src="script.js"></script>

</body>
</html>
